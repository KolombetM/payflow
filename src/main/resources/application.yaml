spring:
  application:
    name: payflow
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
management:
  endpoints:
    web:
      exposure:
        include: health,info,beans,conditions,configprops
  endpoint:
    configprops:
      show-values: always
payflow:
  limits:
    currency: EUR
    daily: 10000
    per-transaction: 1000
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false